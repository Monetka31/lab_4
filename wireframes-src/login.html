<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<style>
  body { height: 760px; display:flex; align-items:center; justify-content:center; background:#f5f5f5; }
  .card { width: 420px; border: 1.5px solid #888; background:#fff; padding: 36px; }
  .logo { text-align:center; margin-bottom: 26px; }
</style></head>
